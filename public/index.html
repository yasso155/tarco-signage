<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarco Screen</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f26;overflow:hidden;cursor:none}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center}
  canvas{display:block;width:1080px;height:1920px}
  #msg{position:fixed;inset:auto 0 12px 0;text-align:center;font:14px/1.4 system-ui,sans-serif;color:#7d86b5;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="msg"></div>
<audio id="bgAudio" loop playsinline preload="auto"></audio>
<button id="unmutePill" style="position:fixed;bottom:24px;left:24px;background:rgba(22,28,66,.92);color:#fff;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);border-radius:99px;padding:10px 20px;font:700 14px Bukra,system-ui,sans-serif;cursor:pointer;display:none;align-items:center;gap:8px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.6);transition:.2s">
  <span>🔊</span>
  <span>اضغط لتشغيل الموسيقى</span>
</button>
<script type="module">
import { Engine, LandscapeEngine, loadFonts, loadImg } from './engine.js';
import { firebaseConfig, configured, FIREBASE_VERSION, DEFAULT_CONFIG } from './firebase-config.js';

const q = new URLSearchParams(location.search);
const cleanPath = location.pathname.replace(/^\/|\/$/g, '').toLowerCase();
const rawHash = location.hash.replace(/^#\/?/, '');
const hashScreen = rawHash.split('?')[0].toLowerCase();
const hashQ = new URLSearchParams(rawHash.includes('?') ? rawHash.split('?')[1] : '');
const SCREEN = (
  q.get('screen') ||
  hashScreen ||
  (cleanPath && cleanPath !== 'index.html' && cleanPath !== 'admin.html' && cleanPath !== 'admin' ? cleanPath : 'default')
).toLowerCase();
const urlRotate = Number(q.get('rotate') || hashQ.get('rotate') || 0);
let currentLandscape = urlRotate % 180 !== 0;
const DEMO = !configured || q.get('demo') === '1';
const msg = document.getElementById('msg');
const say = (t) => { msg.textContent = t || ''; };

// ---- fit stage to window ----
const stage = document.getElementById('stage');
const canvas = document.getElementById('c');

function fitStage() {
  if (!stage) return;
  if (currentLandscape) {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  } else {
    const s = Math.min(innerWidth / 1080, innerHeight / 1920);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
}
addEventListener('resize', fitStage);

// ---- engine setup ----
// a missing font/logo must not leave the screen black: fall back to system font / no logo
try { await loadFonts(); } catch (e) { console.warn('fonts failed, using fallback', e); }
const [logo, qr] = await Promise.all([
  loadImg('assets/logo-white.png').catch(() => null),
  loadImg('assets/qr-default.png').catch(() => null)
]);
let engine = null;

function setEngineOrientation(landscape) {
  if (engine && currentLandscape === landscape) return false;
  currentLandscape = landscape;
  if (landscape) {
    stage.style.width = '1920px'; stage.style.height = '1080px';
    canvas.width = 1920; canvas.height = 1080;
    canvas.style.width = '1920px'; canvas.style.height = '1080px';
    engine = new LandscapeEngine(canvas, { logo, defaultQr: qr });
  } else {
    stage.style.width = '1080px'; stage.style.height = '1920px';
    canvas.width = 1080; canvas.height = 1920;
    canvas.style.width = '1080px'; canvas.style.height = '1920px';
    engine = new Engine(canvas, { logo, defaultQr: qr });
  }
  fitStage();
  return true;
}

setEngineOrientation(currentLandscape);
engine.setConfig(DEFAULT_CONFIG);

let t0 = performance.now(), lastTotal = 0;
function loop(now) {
  if (engine) {
    const total = engine.total;
    if (total !== lastTotal) { lastTotal = total; }
    const t = total ? ((now - t0) / 1000) % total : 0;
    engine.render(t);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- playlist logic ----
let posts = [], conf = {}, appliedQr = null;
const today = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
function visible(p) {
  if (p.active === false) return false;
  const d = today();
  if (p.from && d < p.from) return false;
  if (p.to && d > p.to) return false;
  const b = p.branches || [];
  return !b.length || b.includes(SCREEN);
}

let applying = Promise.resolve();
function apply() {
  applying = applying.then(async () => {
    // 1. Detect branch configuration from Firestore
    const branchData = (conf.branches || []).find((b) => b.id === SCREEN);
    const shouldBeLandscape = (urlRotate % 180 !== 0) || (branchData?.landscape === true);
    const orientationSwitched = setEngineOrientation(shouldBeLandscape);

    // 2. Compute effective footer (branch footer overrides global footer)
    const brFooter = branchData?.footer || {};
    const effectiveFooter = {
      ...DEFAULT_CONFIG.footer,
      ...(conf.footer || {})
    };
    for (const [k, v] of Object.entries(brFooter)) {
      if (v && String(v).trim()) effectiveFooter[k] = String(v).trim();
    }

    // 3. Compute effective QR (branch QR overrides global QR)
    const effectiveQr = branchData?.qrImage || conf.qrImage || null;

    // 4. Configure engine
    const hold = conf.hold || DEFAULT_CONFIG.hold;
    engine.setConfig({
      hold,
      transition: conf.transition ?? DEFAULT_CONFIG.transition,
      zoom: conf.zoom ?? DEFAULT_CONFIG.zoom,
      footer: effectiveFooter
    });

    if (effectiveQr !== appliedQr || orientationSwitched) {
      appliedQr = effectiveQr;
      try {
        engine.setQr(appliedQr ? await loadImg(appliedQr) : null);
      } catch (e) {
        console.warn(e);
      }
    }

    // 5. Update playlist items
    const list = posts.filter(visible).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
      .map((p) => ({ id: p.id, key: p.id + ':' + (p.rev || 0) + ':' + (p.fit || ''), fit: p.fit || '', src: p.img, video: p.video || null, vdur: p.vdur || 0, seconds: p.seconds || null }));

    const wasEmpty = engine.items.length === 0;
    await engine.setPosts(list);
    if (orientationSwitched || wasEmpty) t0 = performance.now();
    window.__count = list.length;

    // 6. Update background audio
    updateAudio();
  }).catch((e) => console.error(e));
  return applying;
}
setInterval(apply, 60 * 1000);   // re-evaluate date ranges

// ---- background audio logic ----
const bgAudio = document.getElementById('bgAudio');
const unmutePill = document.getElementById('unmutePill');
let userHasInteracted = false;
let audioUrlSet = '';

function updateAudio() {
  const a = conf.audio || {};
  const enabled = a.enabled && a.url;
  const vol = Math.max(0, Math.min(1, Number(a.volume ?? 0.4)));

  if (!enabled) {
    if (!bgAudio.paused) bgAudio.pause();
    audioUrlSet = '';
    if (unmutePill) unmutePill.style.display = 'none';
    return;
  }

  bgAudio.volume = vol;
  // compare against the URL we set ourselves: bgAudio.src is always absolute, a.url may be relative
  if (audioUrlSet !== a.url) {
    audioUrlSet = a.url;
    bgAudio.src = a.url;
    bgAudio.load();
  } else if (!bgAudio.paused) {
    return;   // already playing this track: don't touch it
  }

  const p = bgAudio.play();
  if (p !== undefined) {
    p.then(() => {
      if (unmutePill) unmutePill.style.display = 'none';
    }).catch(() => {
      // Browser autoplay policy blocked audio until user tap
      if (unmutePill && !userHasInteracted) {
        unmutePill.style.display = 'flex';
      }
    });
  }
}

function handleUserInteraction() {
  userHasInteracted = true;
  if (unmutePill) unmutePill.style.display = 'none';
  const a = conf.audio || {};
  if (a.enabled && a.url && bgAudio.paused) {
    bgAudio.play().catch(() => {});
  }
}
['click', 'keydown', 'keyup', 'touchstart', 'pointerdown', 'focus', 'mousemove', 'wheel'].forEach((ev) => {
  window.addEventListener(ev, handleUserInteraction, { passive: true });
});
if (unmutePill) unmutePill.addEventListener('click', handleUserInteraction);

// Periodic attempt to play in case policy allows after page load or remote connection
setInterval(() => {
  const a = conf.audio || {};
  if (a.enabled && a.url && bgAudio.paused && !userHasInteracted) {
    const p = bgAudio.play();
    if (p !== undefined) {
      p.then(() => {
        userHasInteracted = true;
        if (unmutePill) unmutePill.style.display = 'none';
      }).catch(() => {});
    }
  }
}, 3000);

// ---- data source ----
if (DEMO) {
  posts = [1, 2, 3, 4].map((n) => ({ id: 'demo' + n, img: `assets/samples/0${n}.jpg`, order: n, active: true, branches: [] }));
  conf = { ...DEFAULT_CONFIG };
  await apply();
  say(configured ? '' : 'DEMO — firebase-config.js not set');
} else {
  try {
    const V = FIREBASE_VERSION, base = `https://www.gstatic.com/firebasejs/${V}/`;
    const { initializeApp } = await import(base + 'firebase-app.js');
    const fs = await import(base + 'firebase-firestore.js');
    const app = initializeApp(firebaseConfig);
    let db;
    try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
    catch (e) { db = fs.getFirestore(app); }
    fs.onSnapshot(fs.collection(db, 'posts'), (snap) => { posts = snap.docs.map((d) => ({ id: d.id, ...d.data() })); apply(); }, (e) => say('posts: ' + e.code));
    fs.onSnapshot(fs.doc(db, 'config', 'main'), (s) => { conf = s.data() || {}; apply(); }, (e) => say('config: ' + e.code));
    const beat = () => fs.setDoc(fs.doc(db, 'screens', SCREEN), { lastSeen: fs.serverTimestamp(), count: window.__count || 0, ua: navigator.userAgent.slice(0, 150) }).catch(() => {});
    setTimeout(beat, 8000); setInterval(beat, 5 * 60 * 1000);
  } catch (e) { console.error(e); say('Firebase error: ' + e.message); }
}

// ---- keep the screen alive ----
async function wake() { try { await navigator.wakeLock?.request('screen'); } catch (e) { /* optional */ } }
wake(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);          // daily-ish self refresh (6h)
addEventListener('click', () => { document.documentElement.requestFullscreen?.().catch(() => {}); });
if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
